[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specfast"
version = "0.0.1"
description = "Precise radial velocities from echelle spectra: extraction and Doppler forward modelling (MINERVA/KiwiSpec first, G-CLEF later)"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "pyyaml>=6.0",
]

[dependency-groups]
# scipy is used only by the tests (least_squares outside the model).
test = ["pytest>=8", "pytest-xdist>=3.5", "pytest-timeout>=2.3", "scipy>=1.11"]
dev = [{include-group = "test"}, "pre-commit>=4,<5", "ruff>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
specfast = ["instruments/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
