      - [431.41, 439.16]   # 55  m = 107
      - [427.42, 435.03]   # 56  m = 108
      - [423.50, 430.98]   # 57  m = 109
      - [419.65, 426.99]   # 58  m = 110
      - [415.88, 423.04]   # 59  m = 111
      - [412.17, 419.21]   # 60  m = 112
      - [408.54, 415.42]   # 61  m = 113
      - [404.97, 411.67]   # 62  m = 114
      - [401.45, 408.00]   # 63  m = 115
      - [398.04, 404.38]   # 64  m = 116
      - [394.73, 400.81]   # 65  m = 117
      - [391.51, 397.26]   # 66  m = 118
      - [388.79, 393.67]   # 67  m = 119
    # Measured ThAr line sigma ~1.5 px; ~1.45 km/s per pixel at m = 86.
    resolving_power: 53000
    detector:
      # Raw SPECTRUM extension: 4160 x 4108 stored, DATASEC [1:4096,1:4096].
      name: 4k x 4k CCD (header DETECTOR = UNKNOWN)
      npix_dispersion: 4096
      npix_cross_dispersion: 4096
      pixel_size_um: null
      raw_shape: [4108, 4160]
      # Header GAIN / RDNOISE differ by unit: LSC 3.4 / 7.5, ELP 3.38 / 6.9,
      # CPT 3.396 / 7.3, TLV 3.396 / 7.0 (e-/ADU, e-).
      gain_e_per_adu: 3.4
      read_noise_e: 7.5
      # MAXLIN 36000 (LSC) to 40000 (others); SATURATE 36000-47500.
      saturation_adu: 36000
      notes: >-
        Gain, read noise and linearity limits are per unit; the values above
        are LSC's. Pixel size not taken from a public source (null).
    notes: >-
      BANZAI-NRES writes 4096 columns per trace; the extracted pixel index is
      the detector column. Arcs and flats light two fibres (configuration
      "110" or "011" in the master-calibration file name), so in a given
      period only fibre 1 and the active science fibre have traces.

header:
  date_obs: [DATE-OBS]
  exptime: [EXPTIME]
  gas_cell_state: []
  gas_cell_in_value: null
  target_ra: [RA]
  target_dec: [DEC]
  # psi in the headers; converted to mbar by the reader.
  spectrograph_pressure: [NRESPRES]
  gas_cell_temperature: []
  detector_temperature: []
  notes: >-
    Spectrograph temperature NRESTEMP, enclosure IGLATEMP. BANZAI-NRES
    audit values: RV, RVERR, BARYCORR (astropy, geometric mid-exposure),
    TCORR, SNR, TEFF/LOGG/FEH (PHOENIX template), SCIFIBER, L1IDARC,
    L1IDFLAT, PIPEVER.

notes:
  - Order indices are those of the specfast product; echelle_orders holds m = 52 + index.
  - "Converter: specfast.converters.nres (BANZAI-NRES e92-1d and master arcs); wavelength model: specfast.wavecal."
