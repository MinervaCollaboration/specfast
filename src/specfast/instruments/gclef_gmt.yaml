# G-CLEF on GMT. PLACEHOLDER: only public headline facts are recorded;
# every unknown number is null. Nothing here derives from the
# (collaboration-private) optical design.
name: gclef_gmt
description: >-
  G-CLEF on GMT: fibre-fed echelle, two arms split by a dichroic,
  ~350-1100 nm in total, no gas cell; simultaneous laser-comb, etalon and
  ThAr reference channels; pupil-sliced science fibre with seven slices (one per
  GMT mirror segment).
status: placeholder
gas_cell: none
wavelength_range_nm: [350.0, 1100.0]    # approximate, both arms together
site: null                              # TODO

channels:
  - {name: S0, role: science, telescope: GMT, slice_index: 0}
  - {name: S1, role: science, telescope: GMT, slice_index: 1}
  - {name: S2, role: science, telescope: GMT, slice_index: 2}
  - {name: S3, role: science, telescope: GMT, slice_index: 3}
  - {name: S4, role: science, telescope: GMT, slice_index: 4}
  - {name: S5, role: science, telescope: GMT, slice_index: 5}
  - {name: S6, role: science, telescope: GMT, slice_index: 6}
  - {name: COMB, role: reference_comb}
  - {name: ETALON, role: reference_etalon}
  - {name: THAR, role: reference_thar}

arms:
  - name: blue
    channels: [S0, S1, S2, S3, S4, S5, S6, COMB, ETALON, THAR]
    orders: []                   # TODO
    wavelength_range_nm: null    # TODO: dichroic split
    detector: {name: blue}       # TODO: geometry, gain, read noise
  - name: red
    channels: [S0, S1, S2, S3, S4, S5, S6, COMB, ETALON, THAR]
    orders: []                   # TODO
    wavelength_range_nm: null    # TODO
    detector: {name: red}        # TODO

notes:
  - Which reference channels feed which arm is not recorded here (TODO).
