                59, 60, 61, 62, 63, 64, 65, 66, 67, 68, 69, 71, 72, 73, 74, 75,
                76, 77, 78, 80, 81, 82, 83, 84, 90, 91, 92, 94, 95]
    wavelength_range_nm: [357.1, 1125.1]
