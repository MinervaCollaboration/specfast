    # Quoted for the HR mode; the HE mode's is in modes. The CCF FWHM of
    # the Sun (~7.1 km/s) includes rotation and macroturbulence, so it does
    # not measure the LSF.
    resolving_power: 110000
    order_spacing_px: null
    slit_pitch_px: null
    detector:
      # Header DETECTOR = e2v CCD290-99, DETSIZE [9216,9232], NAMPS 16.
      name: e2v CCD290-99
      npix_dispersion: 9216
      npix_cross_dispersion: 9232
      pixel_size_um: 10.0
      # Per amplifier, as stored: 16 image extensions "AMPLIFIER 01..16" of
      # 5000 x 1250 (rows x columns, uint16, BZERO 32768), each with DETSEC,
      # DATASEC and three bias sections (BIASSEC1..3: prescan, parallel and
      # serial overscan) in its header. Amplifiers 1-8 read the bottom half
      # (rows 1-4616), 9-16 the top (4617-9232); 1152 imaging columns each.
      raw_shape: [5000, 1250]
      # CCDGAIN per amplifier, 1.645-1.660 e-/ADU (2024-05-15 L0).
      gain_e_per_adu: 1.653
      # CCDRN per amplifier, 4.28-5.07 e- (2024-05-15 L0).
      read_noise_e: 4.6
      saturation_adu: null
      notes: >-
        The L1 flux is in electrons after a flat-relative optimal extraction
        (EXTRACT = flatRelativeOptimal) multiplied by a smooth lamp SED
        ("Multiplied Flat Continuum to remove Flat SED"), so it is not raw
        electrons; SCIVAR is the matching variance. L0 frames also carry the
        exposure-meter cube (EXPMETER), the guider image and, for the solar
        feed, a pyrheliometer table (SOLAR).

header:
  date_obs: [DATE-OBS]           # shutter open, UTC (also SHUTOPEN; SHUTCLSD = close)
  exptime: [EXPTIME]
  gas_cell_state: []
  gas_cell_in_value: null
  # Queue catalogue position (sexagesimal, J2000; QEPOCH, QPMRA, QPMDEC,
  # QPLX, QRV alongside). Empty or 0 for the solar feed.
  target_ra: [QRA]
  target_dec: [QDEC]
  # MKS gauge, Torr (not mbar): converted by the reader.
  spectrograph_pressure: [PMKSTOP]
  gas_cell_temperature: []
  detector_temperature: [CCDTEMP]
  notes: >-
    Barycentric products are per order: SSBZnnn (z_B), SSBRVnnn (km/s) and
    SSBJDnnn (BJD_TDB of the flux-weighted midpoint), weighted by the
    chromatic exposure meter, for every echelle order m = nnn. They are
    audit-only inputs for specfast, which releases raw redshifts. For the
    solar feed they are the Sun-observer terms (z_B ~ -2.5e-6). Wavelength
    calibration: WAVECAL, MDSPFILE (master solution), DRIFTFUN, DRIFTREF,
    DRIFTRV0..2, ZPTDRIFT (SCIWAVE header). Quality: DQLEVEL0..2.

notes:
  - Order indices are those of the L1 product; echelle_orders holds m = 173 - index.
  - "L2 files contain every L1 extension unchanged (checked byte-for-byte on SCI/SKY/CAL flux, variance and wavelength) plus TELLURIC, CCFS, ACTIVITY, EXPMETER, *BLAZE and a stitched spectrum."
