notes:
  - >-
    Dichroic split ~540 nm: echelle order 114 (533-543 nm) is designed onto
    both arms as the overlap order; orders on the chips beyond the dichroic
    edge (blue 113, red 115-116) are left out.
  - >-
    Adjacent orders overlap in wavelength (blue by 4.1-4.7 nm) except for a 0.2
    nm gap near 952.4 nm between red orders 65 and 64.
  - >-
    Wavelengths are the design's (vacuum enclosure); the design's red limit is
    ~967 nm (order 64), not 1100 nm.
  - >-
    resolving_power is lambda over the dispersion times the projected width of
    a 100 um PRV core (geometric, full width). The public papers quote R =
    108,000 for PRV; the FWHM of a round core image is ~0.87 of its width.
  - >-
    Traces: within an order, adjacent PRV fibre positions are slit_pitch_px
    apart across the dispersion; a 100 um core images to ~8 px. The design
    models four of the nine PRV fibres, spanning 7 pitches (~93 px). Nine
    fibres at this pitch would span 8 pitches (~107 px), as much as the bluest
    order spacing (105 px). Which slit position each fibre occupies is not in
    the design (slit_position null).
  - >-
    Differs from gclef_gmt only in the fibre feed (one science fibre, not seven
    slices); the arms, orders and detectors are the same. The design models the
    GMT pseudo-slit; where the Magellan fibre sits on it is not given.
  - >-
    Pixel size 9 um: STA1600 (public); the design gives the 95.04 mm square
    detector, which is 10560 such pixels.
  - >-
    Other modes in the same pseudo-slit (NS-PRV, MR, HT) are offset along the
    dispersion and are not described here.
