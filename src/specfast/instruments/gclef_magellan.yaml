# G-CLEF on Magellan. PROVISIONAL. Numbers marked "derived from the G-CLEF optical
# design (2021-12 model)" were computed from the collaboration-private design
# (chief-ray trace) by specfast-zemax2instrument; no prescription data is
# recorded here. Other facts: JDE (2026-11-23) and the public G-CLEF papers
# (Ben-Ami et al. 2018, SPIE 10702, 107029K; Jurgenson et al., EPRV5 2023 poster
# "G@M", Table 1; gclef.cfa.harvard.edu). Unknown numbers are null.
name: gclef_magellan
description: >-
  G-CLEF on Magellan (G@M): the same spectrograph as on GMT (fibre-fed R4
  echelle, vacuum enclosure, no gas cell, blue and red arms split by a
  dichroic), fed through two telescope interfaces: natural seeing (MR, HR and
  pupil-sliced extreme-HR modes, each fibre paired with a sky fibre) and
  MagAO-X (a single fibre and a 16-spaxel IFU). Calibration light (comb,
  etalon, ThAr) is injected at the front end into science/sky fibre pairs;
  there are no separate calibration fibres on the slit.
status: provisional
gas_cell: none
