modes:
  - name: MR
    channels: [S0, K0]
    interface: natural seeing
    field_of_view_arcsec: 1.12
    resolving_power_quoted: 100000.0
    notes: >-
      Medium resolution: science + sky fibre. Core not published; 1.12 arcsec
      at the f/3 fibre input of a 6.5 m telescope is ~106 um.
  - name: HR
    channels: [S0, K0]
    interface: natural seeing
    field_of_view_arcsec: 0.8
    resolving_power_quoted: 140000.0
    notes: >-
      High resolution: science + sky fibre. Core not published; 0.8 arcsec at
      f/3 is ~76 um.
  - name: XHR
    channels: [S0, S1, S2, S3, K0, K1, K2, K3]
    interface: natural seeing
    field_of_view_arcsec: 1.05
    resolving_power_quoted: 300000.0
    notes: >-
      Pupil-sliced extreme high resolution: 4 x 2 fibres (science + sky); R >
      300,000 (lower bound quoted). How the four slices are paired with sky
      fibres is assumed.
  - name: MagAO-X
    channels: [X0]
    interface: MagAO-X
    field_of_view_arcsec: 0.8
    resolving_power_quoted: 140000.0
    notes: "One fibre behind MagAO-X; enhanced throughput over HR."
  - name: MagAO-X-IFU
    channels: [U00, U01, U02, U03, U04, U05, U06, U07, U08, U09, U10, U11, U12, U13, U14, U15]
    interface: MagAO-X
    field_of_view_arcsec: 0.12
    resolving_power_quoted: 200000.0
    notes: "16-spaxel IFU, 0.12 x 0.12 arcsec; R > 200,000 (lower bound quoted)."
notes:
  - >-
    Dichroic split ~540 nm: echelle order 114 (533-543 nm) is designed onto
    both arms as the overlap order; orders on the chips beyond the dichroic
    edge (blue 113, red 115-116) are left out.
  - >-
    Adjacent orders overlap in wavelength (blue by 4.1-4.7 nm) except for a 0.2
    nm gap near 952.4 nm between red orders 65 and 64.
  - >-
    Wavelengths are the design's (vacuum enclosure); the design's red limit is
    ~967 nm (order 64), not 1100 nm.
  - >-
    resolving_power is lambda over the dispersion times the projected width of
    a 100 um PRV core (geometric, full width). The public papers quote R =
    108,000 for PRV; the FWHM of a round core image is ~0.87 of its width.
  - >-
    Traces: within an order, adjacent PRV fibre positions are slit_pitch_px
    apart across the dispersion; a 100 um core images to ~8 px. The design
    models four of the nine PRV fibres, spanning 7 pitches (~93 px). Nine
    fibres at this pitch would span 8 pitches (~107 px), as much as the bluest
    order spacing (105 px). Which slit position each fibre occupies is not in
    the design (slit_position null).
  - >-
    Pixel size 9 um: STA1600 (public); the design gives the 95.04 mm square
    detector, which is 10560 such pixels.
  - >-
    Modes (Jurgenson et al., EPRV5 2023 poster, Table 1): the 2021-12 design
    models the GMT fibre rows, not these, so no per-mode design values are
    given. Channels are logical (S0 is the first science fibre of whichever
    mode is in use). No default mode: a run must choose.
  - >-
    Quoted R x core: with the cores inferred from the field of view at f/3, MR
    (~106 um, 100,000) and HR (~76 um, 140,000) give ~10.6e6 um, matching the
    GMT PRV value (108,000 x 100 um); the design's geometric definition gives
    ~7.3e6.
  - >-
    Arms, orders and detectors are the same as gclef_gmt; only the fibre feed
    differs.
